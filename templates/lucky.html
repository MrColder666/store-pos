<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>幸运大转盘 - Store POS</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.lucky-container { max-width: 800px; margin: 0 auto; padding: 12px 16px; }
.row-main { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px; }
.wheel-area { flex: 1; min-width: 300px; display: flex; flex-direction: column; align-items: center; }
.wheel-wrapper { position: relative; width: 280px; height: 280px; margin: 0 auto; }
canvas#wheelCanvas { width: 100%; height: 100%; display: block; border-radius: 50%; box-shadow: 0 8px 24px rgba(99,102,241,0.25), 0 0 0 4px #ede9fe, 0 0 0 8px var(--primary-light); cursor: pointer; background: #faf5ff; }
.pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 36px; height: 40px; z-index: 10; }
.pointer::before { content: "▲"; font-size: 44px; line-height: 1; color: var(--danger); display: block; text-shadow: 0 3px 6px rgba(0,0,0,0.3); }
.spin-btn { margin-top: 14px; background: radial-gradient(circle at 30% 20%, #a78bfa, var(--primary)); border: none; padding: 12px 40px; border-radius: 64px; font-size: 20px; font-weight: 700; color: #fff; box-shadow: 0 6px 0 #5b21b6, 0 8px 20px rgba(124,58,237,0.35); transition: .07s; letter-spacing: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.spin-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #5b21b6; }
.spin-btn:disabled { opacity: .5; transform: translateY(3px); box-shadow: 0 3px 0 #4c1d95; pointer-events: none; }
.result-toast { margin-top: 10px; min-height: 38px; font-size: 16px; font-weight: 600; color: var(--text); background: var(--primary-soft); padding: 8px 20px; border-radius: 72px; display: flex; align-items: center; justify-content: center; gap: 8px; width: fit-content; max-width: 92%; }
.info-panel { flex: 1; min-width: 240px; background: var(--surface); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-md); border: 1px solid var(--border-light); display: flex; flex-direction: column; gap: 10px; }
.section-title { font-size: 15px; font-weight: 700; color: var(--text); border-bottom: 2px dashed var(--primary-soft); padding-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.badge-transparent { background: var(--success); color: #fff; border-radius: 99px; padding: 2px 12px; font-size: 12px; font-weight: 500; display: inline-block; margin-left: 6px; }
.prob-list { list-style: none; display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; padding-right: 4px; font-size: 13px; }
.prob-list li { display: flex; justify-content: space-between; background: var(--bg); padding: 4px 10px; border-radius: 24px; align-items: center; }
.prob-value { font-weight: 700; background: var(--primary-soft); padding: 0 10px; border-radius: 66px; font-size: 12px; color: var(--primary); }
.slogan-box { background: linear-gradient(135deg, #fef3c7, #fde68a); border-radius: var(--radius); padding: 10px 14px; border-left: 4px solid var(--accent); }
.slogan-box p { font-size: 14px; color: #92400e; font-weight: 600; margin: 0; }
.slogan-box .tag { font-size: 11px; color: #78350f; margin-top: 2px; }
.potato-row { display: flex; gap: 4px; font-size: 28px; }
.potato-dim { opacity: 0.25; }
.admin-btn { cursor: pointer; color: var(--primary); margin-left: 4px; font-size: 14px; font-weight: 700; }
.qr-row { display: flex; gap: 10px; margin-top: 6px; }
.qr-card { flex: 1; text-align: center; background: var(--bg); border-radius: var(--radius-sm); padding: 8px; }
.qr-card img { width: 80px; height: 80px; border-radius: 6px; border: 2px solid var(--border); }
.qr-card .label { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
@media (max-width: 640px) { .row-main { flex-direction: column; } .wheel-wrapper { width: 240px; height: 240px; } }
</style>
</head>
<body>
<div class="header">
  <h1>🎰 幸运大转盘</h1>
  <div class="sub">中奖概率透明，无套路！</div>
</div>

<div class="lucky-container">
  <div class="row-main">
    <!-- 左侧转盘 -->
    <div class="wheel-area">
      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="560" height="560"></canvas>
      </div>
      <button class="spin-btn" id="spinButton">🎯 抽奖</button>
      <div class="result-toast" id="resultDisplay">👆 点击转盘或按钮开始</div>
      <div class="slogan-box" style="margin-top:10px;text-align:center;">
        <p>✨ 每3次抽奖，就有2次中奖哦！</p>
        <div class="tag">（中奖率 70%）</div>
      </div>
      <div class="slogan-box" style="margin-top:6px;text-align:center;border-left-color:var(--primary);">
        <p>🥔 集齐「薯」「片」「好吃」免费领 2 包薯片！</p>
        <div class="tag">
          已兑换 <b id="completeCount">?</b>/3 次（限量）
          <span class="admin-btn" onclick="openAdmin()" title="管理">＋</span>
        </div>
      </div>
    </div>

    <!-- 右侧面板 -->
    <div class="info-panel">
      <div class="section-title">📊 中奖概率 <span class="badge-transparent">透明公开</span></div>
      <canvas id="pieChart" width="260" height="200" style="width:100%;max-width:260px;margin:0 auto;display:block;"></canvas>
      <ul class="prob-list" id="probabilityList"></ul>
      <div class="section-title">🧩 集字有奖</div>
      <div style="text-align:center;font-size:22px;font-weight:700;color:var(--text);">薯 片 好吃</div>
      <div class="potato-row" style="justify-content:center;" id="potatoRow">
        <span>🥔</span><span>🥔</span><span>🥔</span>
      </div>
      <div style="text-align:center;font-size:12px;color:var(--text-secondary);">集齐「薯」「片」「好吃」→ 免费领2包薯片！</div>
      <div class="section-title">📱 扫码关注</div>
      <div class="qr-row">
        <div class="qr-card">
          <img src="/static/qr/wechat.png" alt="微信" onerror="this.style.display='none'">
          <div class="label">微信</div>
        </div>
        <div class="qr-card">
          <img src="/static/qr/alipay.png" alt="支付宝" onerror="this.style.display='none'">
          <div class="label">支付宝</div>
        </div>
      </div>
    </div>
  </div>
</div>

<nav class="tab-bar">
  <a href="/"><span class="icon">🧾</span>收银</a>
  <a href="/products"><span class="icon">📦</span>商品</a>
  <a href="/orders"><span class="icon">📋</span>订单</a>
  <a href="/lucky" class="active"><span class="icon">🎰</span>抽奖</a>
  <a href="/stats"><span class="icon">📊</span>统计</a>
</nav>

<div class="toast" id="toast"></div>
<div class="version-badge">v2.3.0</div>

<!-- Admin Modal -->
<div class="modal-bg" id="admin-bg">
  <div class="modal" style="text-align:center;max-width:360px;">
    <h2>🔐 管理员操作</h2>
    <p style="font-size:14px;color:var(--text-secondary);margin-bottom:8px;">
      当前已兑换 <b id="adminCurrent">0</b>/3 次
    </p>
    <div class="btn-row" style="flex-direction:column;gap:8px;">
      <button class="btn btn-accent btn-block" onclick="adminDecrement()">－ 减少一次（退一个额度）</button>
      <button class="btn btn-danger btn-block" onclick="adminReset()">🔄 重置进度（回到 3 次）</button>
    </div>
    <button class="btn" style="background:#f1f5f9;margin-top:12px;width:100%;" onclick="closeAdmin()">关闭</button>
  </div>
</div>

<!-- Password Modal -->
<div class="modal-bg" id="pw-bg">
  <div class="modal" style="text-align:center;max-width:360px;">
    <h2>🔐 管理员密码</h2>
    <input class="form-input" id="pw-input" type="password" placeholder="请输入密码" style="text-align:center;font-size:18px;margin-bottom:12px;">
    <div class="btn-row">
      <button class="btn" style="background:#f1f5f9;" onclick="closePw()">取消</button>
      <button class="btn btn-primary" onclick="confirmPw()">确认</button>
    </div>
  </div>
</div>

<script>
function toast(m) { const t=document.getElementById('toast'); t.textContent=m; t.className='toast show'; setTimeout(()=>t.className='toast',2000); }

(function() {
  // ── Prize data (shuffled) ──
  const prizeSlots = [
    '薯','谢谢惠顾','片','再抽一次','好吃','谢谢惠顾',
    '免费冰粉一杯','全场9折券','3元代金券','谢谢惠顾',
    '薯','再抽一次','片','谢谢惠顾','3元代金券','再抽一次',
    '全场9折券','谢谢惠顾','3元代金券','谢谢惠顾'
  ];
  for (let i = prizeSlots.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [prizeSlots[i], prizeSlots[j]] = [prizeSlots[j], prizeSlots[i]];
  }

  const countMap = {};
  prizeSlots.forEach(p => countMap[p] = (countMap[p]||0) + 1);
  const total = prizeSlots.length;
  const uniquePrizes = Object.keys(countMap).sort();

  // ── Probability list ──
  (function() {
    let html = '';
    uniquePrizes.forEach(name => {
      html += `<li><span>${name}</span><span class="prob-value">${Math.round(countMap[name]/total*100)}%</span></li>`;
    });
    document.getElementById('probabilityList').innerHTML = html;
  })();

  // ── Pie chart ──
  (function() {
    const pc = document.getElementById('pieChart');
    const pctx = pc.getContext('2d');
    const pw=pc.width, ph=pc.height, pr=Math.min(pw,ph)/2-20, px=pw/2, py=ph/2;
    const colors = ['#7c3aed','#a78bfa','#c4b5fd','#ddd6fe','#ede9fe','#f59e0b','#fbbf24','#fcd34d'];
    let sa = -Math.PI/2;
    uniquePrizes.forEach((name,i) => {
      const pct = countMap[name]/total, ea = sa+pct*Math.PI*2;
      pctx.beginPath(); pctx.moveTo(px,py); pctx.arc(px,py,pr,sa,ea); pctx.closePath();
      pctx.fillStyle = colors[i%colors.length]; pctx.fill();
      pctx.strokeStyle = '#fff'; pctx.lineWidth = 2; pctx.stroke();
      const mid = sa + (ea-sa)/2;
      pctx.fillStyle = '#1e1b4b'; pctx.font = 'bold 11px sans-serif'; pctx.textAlign = 'center';
      pctx.fillText(Math.round(pct*100)+'%', px+Math.cos(mid)*pr*0.65, py+Math.sin(mid)*pr*0.65);
      sa = ea;
    });
    pctx.beginPath(); pctx.arc(px,py,pr*0.45,0,Math.PI*2); pctx.fillStyle='#fff'; pctx.fill();
    pctx.fillStyle='#1e1b4b'; pctx.font='bold 16px sans-serif'; pctx.textAlign='center'; pctx.fillText('概率',px,py+2);
  })();

  // ── Canvas wheel ──
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const W=560, H=560, cx=W/2, cy=H/2, radius=255;
  const wheelColors = [
    '#7c3aed','#a78bfa','#8b5cf6','#c4b5fd','#6d28d9','#ddd6fe',
    '#9333ea','#a855f7','#7e22ce','#c084fc','#581c87','#d8b4fe',
    '#6b21a8','#9d4edd','#5b21b6','#b57bee','#4c1d95','#8f5df6',
    '#3b0764','#af7bee'
  ];
  let currentRotation = 0, isSpinning = false;

  function drawWheel(rot) {
    ctx.clearRect(0, 0, W, H);
    const sliceAngle = (Math.PI*2) / prizeSlots.length;
    for (let i = 0; i < prizeSlots.length; i++) {
      const sa = rot + i * sliceAngle, ea = sa + sliceAngle;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,radius,sa,ea); ctx.closePath();
      ctx.fillStyle = wheelColors[i % wheelColors.length]; ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

      const mid = sa + sliceAngle/2;
      const textR = radius * 0.7;
      const x = cx + Math.cos(mid) * textR;
      const y = cy + Math.sin(mid) * textR;
      let label = prizeSlots[i];
      if (label.includes('3元代金券')) label = '3元券';
      else if (label.includes('全场9折')) label = '9折券';
      else if (label.includes('免费冰粉')) label = '冰粉';

      ctx.save();
      ctx.translate(x, y);
      // Rotate text so it ALWAYS reads radially outward (top-to-bottom for top, etc.)
      // mid points from center to slice center. Text should align with that radial direction.
      const textAngle = mid + Math.PI/2; // rotate 90° so text is perpendicular to radius
      ctx.rotate(textAngle);
      ctx.font = 'bold 22px "PingFang SC",sans-serif';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 4;
      ctx.fillText(label, 0, 0);
      ctx.restore();
    }
    // Center
    ctx.beginPath(); ctx.arc(cx,cy,44,0,Math.PI*2);
    ctx.fillStyle = '#ede9fe'; ctx.shadowBlur = 12; ctx.shadowColor = '#7c3aed';
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = '#7c3aed'; ctx.lineWidth = 4; ctx.stroke();
    ctx.font = 'bold 26px sans-serif'; ctx.fillStyle = '#4c1d95';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('抽奖',cx,cy);
  }
  drawWheel(currentRotation);

  // ── Spin logic ──
  const spinBtn = document.getElementById('spinButton');
  const resultDisplay = document.getElementById('resultDisplay');

  function getPrize(angle) {
    const sliceAngle = (Math.PI*2) / prizeSlots.length;
    const pointerAngle = -Math.PI/2;
    let diff = (pointerAngle - angle) % (Math.PI*2);
    if (diff < 0) diff += Math.PI*2;
    return prizeSlots[Math.floor(diff / sliceAngle) % prizeSlots.length];
  }

  function spinWheel() {
    if (isSpinning) return;
    isSpinning = true; spinBtn.disabled = true;
    resultDisplay.innerHTML = '🎰 转动中...';
    const extra = 5+Math.random()*3;
    const target = currentRotation + extra*2*Math.PI + Math.random()*2*Math.PI;
    const start = currentRotation, totalDist = target-start;
    const duration = 1800+Math.random()*800;
    const startTime = performance.now();

    function anim(time) {
      const p = Math.min((time-startTime)/duration, 1);
      const eased = 1-Math.pow(1-p,3);
      const rot = start + totalDist*eased;
      drawWheel(rot);
      currentRotation = rot;
      if (p < 1) { requestAnimationFrame(anim); return; }
      drawWheel(currentRotation);
      const prize = getPrize(currentRotation);
      const emojis = {'薯':'🥔','片':'🥔','好吃':'🥔','免费冰粉一杯':'🍧','3元代金券':'🧾','再抽一次':'🔄','全场9折券':'🏷️','谢谢惠顾':'😅'};
      resultDisplay.innerHTML = `${emojis[prize]||'🎉'} 恭喜：${prize}`;
      isSpinning = false; spinBtn.disabled = false;
    }
    requestAnimationFrame(anim);
  }

  spinBtn.addEventListener('click', spinWheel);
  canvas.addEventListener('click', spinWheel);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); spinWheel(); });

  // ── Load completion count ──
  function loadCount() {
    fetch('/api/lucky/count').then(r=>r.json()).then(d => {
      document.getElementById('completeCount').textContent = d.count;
      document.getElementById('adminCurrent').textContent = d.count;
      // Update potatoes: 3 - count are bright, count are dim
      const potatoes = document.getElementById('potatoRow').children;
      for (let i = 0; i < 3; i++) {
        potatoes[i].className = i < d.count ? 'potato-dim' : '';
      }
    });
  }
  loadCount();
})();

// ── Admin flow ──
function openAdmin() {
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-bg').classList.add('active');
  setTimeout(() => document.getElementById('pw-input').focus(), 100);
}
function closePw() { document.getElementById('pw-bg').classList.remove('active'); }
function closeAdmin() { document.getElementById('admin-bg').classList.remove('active'); }

function confirmPw() {
  if (document.getElementById('pw-input').value !== '102938') { toast('❌ 密码错误'); return; }
  document.getElementById('pw-bg').classList.remove('active');
  document.getElementById('admin-bg').classList.add('active');
}

async function adminDecrement() {
  const res = await fetch('/api/lucky/decrement', { method: 'POST' });
  const d = await res.json();
  if (d.error) { toast('❌ ' + d.error); } else { toast('✅ 已减少，剩余 ' + (3-d.count) + ' 次'); }
  closeAdmin();
  // Reload count
  fetch('/api/lucky/count').then(r=>r.json()).then(d => {
    document.getElementById('completeCount').textContent = d.count;
    document.getElementById('adminCurrent').textContent = d.count;
    const potatoes = document.getElementById('potatoRow').children;
    for (let i = 0; i < 3; i++) potatoes[i].className = i < d.count ? 'potato-dim' : '';
  });
}

async function adminReset() {
  const res = await fetch('/api/lucky/reset', { method: 'POST' });
  const d = await res.json();
  if (d.ok) { toast('✅ 已重置为 3 次'); }
  closeAdmin();
  fetch('/api/lucky/count').then(r=>r.json()).then(d => {
    document.getElementById('completeCount').textContent = d.count;
    document.getElementById('adminCurrent').textContent = d.count;
    const potatoes = document.getElementById('potatoRow').children;
    for (let i = 0; i < 3; i++) potatoes[i].className = i < d.count ? 'potato-dim' : '';
  });
}
</script>
</body>
</html>
