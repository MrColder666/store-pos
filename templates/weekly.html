<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>每周收益 - Store POS</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="header">
  <h1>📈 每周收益明细</h1>
  <div class="sub" id="week-label">本周</div>
</div>

<div class="container">
  <!-- Summary Cards -->
  <div class="stat-grid">
    <div class="stat-card"><div class="num" id="w-revenue">-</div><div class="label">本周营收</div></div>
    <div class="stat-card"><div class="num" id="w-orders">-</div><div class="label">总订单</div></div>
    <div class="stat-card"><div class="num" id="w-items">-</div><div class="label">售出件数</div></div>
  </div>

  <!-- Daily Revenue Bar Chart -->
  <div class="card">
    <h3>📊 每日营收</h3>
    <div class="chart-bar-container" id="daily-chart"></div>
    <a href="/api/stats/weekly/chart.png" class="btn btn-sm" style="display:block;text-align:center;margin-top:10px;background:#f1f5f9;width:100%;text-decoration:none;">
      🖼️ 导出图表为 PNG
    </a>
  </div>

  <!-- Hourly Distribution -->
  <div class="card">
    <h3>🕐 时段分布（订单数）</h3>
    <div class="hour-chart" id="hour-chart"></div>
  </div>

  <!-- Daily Breakdown Table -->
  <div class="card">
    <h3>📅 每日明细</h3>
    <div class="table-wrap">
      <table id="daily-table">
        <tr><th>日期</th><th>星期</th><th>订单数</th><th>售出件数</th><th>营收</th></tr>
      </table>
    </div>
  </div>

  <!-- Order Timeline -->
  <div class="card">
    <h3>📋 本周订单时间线</h3>
    <div id="order-timeline"></div>
  </div>

  <!-- Export -->
  <a href="/api/export/weekly.csv" class="btn btn-primary btn-block" style="text-decoration:none;text-align:center;margin-bottom:12px;" download>
    📥 导出本周数据 CSV
  </a>
</div>

<nav class="tab-bar">
  <a href="/"><span class="icon">🧾</span>收银</a>
  <a href="/products"><span class="icon">📦</span>商品</a>
  <a href="/orders"><span class="icon">📋</span>订单</a>  <a href="/lucky"><span class="icon">🎰</span>抽奖</a>
  <a href="/members"><span class="icon">👤</span>会员</a>
  <a href="/stats" class="active"><span class="icon">📊</span>统计</a>
</nav>

<div class="toast" id="toast"></div>

<script>
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show';
  setTimeout(() => t.className = 'toast', 2000);
}

async function loadWeekly() {
  const res = await fetch('/api/stats/weekly');
  const d = await res.json();

  // Week label
  document.getElementById('week-label').textContent = `${d.week_start} ~ ${d.week_end}`;

  // Summary
  document.getElementById('w-revenue').textContent = '¥' + d.total_revenue.toFixed(2);
  document.getElementById('w-orders').textContent = d.total_orders;
  document.getElementById('w-items').textContent = d.total_items;

  // ── Daily Bar Chart ──
  const dailyValues = d.daily.map(day => day.revenue);
  const maxRevenue = Math.max(...dailyValues, 1);
  const chartEl = document.getElementById('daily-chart');
  chartEl.innerHTML = d.daily.map((day, i) => {
    const pct = (day.revenue / maxRevenue) * 100;
    const dayLabel = d.day_names[i];
    const shortDate = day.day.slice(5); // MM-DD
    return `
      <div class="chart-bar-wrap">
        <div class="chart-bar-value">¥${day.revenue.toFixed(1)}</div>
        <div class="chart-bar" style="height:${Math.max(pct, 3)}%;" title="${day.day}: ¥${day.revenue.toFixed(2)}"></div>
        <div class="chart-bar-label">${dayLabel}<br>${shortDate}</div>
      </div>
    `;
  }).join('');

  // ── Hourly Distribution ──
  const hours = {};
  for (let h = 0; h < 24; h++) hours[h] = 0;
  d.hour_distribution.forEach(h => { hours[h.hour] = h.count; });
  const maxHourCount = Math.max(...Object.values(hours), 1);
  const hourEl = document.getElementById('hour-chart');
  hourEl.innerHTML = Object.entries(hours).map(([h, count]) => {
    const pct = (count / maxHourCount) * 100;
    const label = h.padStart(2, '0') + ':00';
    return `
      <div class="hour-bar-wrap">
        <div class="hour-bar" style="height:${Math.max(pct, 2)}%;" title="${label}: ${count}单"></div>
        <div class="hour-label">${h}</div>
      </div>
    `;
  }).join('');

  // ── Daily Table ──
  const dayNamesFull = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
  const tableEl = document.getElementById('daily-table');
  let tableHtml = '<tr><th>日期</th><th>星期</th><th>订单数</th><th>售出件数</th><th>营收</th></tr>';
  d.daily.forEach((day, i) => {
    tableHtml += `
      <tr>
        <td>${day.day}</td>
        <td>${dayNamesFull[i]}</td>
        <td>${day.order_count}</td>
        <td>${day.items_sold}</td>
        <td style="font-weight:600;color:var(--primary);">¥${day.revenue.toFixed(2)}</td>
      </tr>
    `;
  });
  // Total row
  tableHtml += `
    <tr style="font-weight:700;background:#f1f5f9;">
      <td colspan="2">合计</td>
      <td>${d.total_orders}</td>
      <td>${d.total_items}</td>
      <td style="color:var(--primary);">¥${d.total_revenue.toFixed(2)}</td>
    </tr>
  `;
  tableEl.innerHTML = tableHtml;

  // ── Order Timeline ──
  const timelineEl = document.getElementById('order-timeline');
  if (d.orders.length === 0) {
    timelineEl.innerHTML = '<div style="color:var(--text-secondary);font-size:14px;padding:16px 0;">本周暂无订单</div>';
    return;
  }

  timelineEl.innerHTML = '<div class="timeline">' + d.orders.map(o => {
    const itemsList = o.items.map(i => `${i.product_name}×${i.quantity}`).join('、');
    return `
      <div class="timeline-item">
        <div class="time">#${o.id} · ${o.created_at}</div>
        <div class="amount">¥${o.total_amount.toFixed(2)} <span style="font-weight:400;font-size:12px;color:var(--text-secondary);">(${o.item_count}件)</span></div>
        <div class="items-detail">${itemsList}</div>
        ${o.note ? `<div class="items-detail" style="color:#8b5cf6;font-size:12px;">📝 ${o.note}</div>` : ''}
      </div>
    `;
  }).join('') + '</div>';
}

loadWeekly();
</script>
<div class="version-badge">v2.4.0</div>
<script>
(function(){document.body.addEventListener('click',function(e){var t=e.target.closest('button');if(!t||t.disabled)return;try{var a=new(window.AudioContext||window.webkitAudioContext)();a.resume();var o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=800;g.gain.setValueAtTime(0.03,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.04);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+0.04)}catch(e){}})})();
</script>
</body>
</html>
