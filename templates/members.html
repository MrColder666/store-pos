<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>会员管理 - Store POS</title><style>body{visibility:hidden}</style><link rel="stylesheet" href="/static/style.css" onload="document.body.style.visibility='visible'"></head>
<body style="visibility:hidden">
<div class="header"><h1>👤 会员管理</h1><div class="sub">会员折扣 · 连续消费追踪</div></div>
<div class="container">
  <button class="btn btn-primary btn-block" onclick="openRegister()">＋ 注册会员</button>
  <div style="margin-top:12px;" id="member-list"></div>
</div>
<nav class="tab-bar">
  <a href="/"><span class="icon">🧾</span>收银</a>
  <a href="/products"><span class="icon">📦</span>商品</a>
  <a href="/orders"><span class="icon">📋</span>订单</a>
  <a href="/members" class="active"><span class="icon">👤</span>会员</a>
  <a href="/stats"><span class="icon">📊</span>统计</a>
  <a href="/lucky"><span class="icon">🎰</span>抽奖</a>
</nav>
<div class="toast" id="toast"></div>

<!-- Register Modal -->
<div class="modal-bg" id="modal-bg"><div class="modal">
  <h2 id="modal-title">注册会员</h2>
  <div class="form-group"><label>姓名 *</label><input class="form-input" id="f-name" placeholder="顾客姓名"></div>
  <div class="form-group"><label>密码 *</label><input class="form-input" id="f-pw" type="password" placeholder="自定义密码"></div>
  <div class="btn-row"><button class="btn btn-ghost" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveMember()">注册</button></div>
</div></div>

<!-- Confirm Modal -->
<div class="modal-bg" id="confirm-bg"><div class="modal" style="text-align:center;"><h2>⚠️ 确认删除</h2><p style="color:var(--text-secondary);margin-bottom:12px;" id="confirm-msg"></p><div class="btn-row"><button class="btn btn-ghost" id="confirm-cancel">取消</button><button class="btn btn-danger" id="confirm-ok">删除</button></div></div></div>

<div class="version-badge">v2.6.1</div>

<script>
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='toast show';setTimeout(function(){t.className='toast'},2000);}
function openRegister(){document.getElementById('modal-title').textContent='注册会员';document.getElementById('f-name').value='';document.getElementById('f-pw').value='';document.getElementById('modal-bg').classList.add('active');}
function closeModal(){document.getElementById('modal-bg').classList.remove('active');}

function confirmDelete(msg){return new Promise(function(resolve){document.getElementById('confirm-msg').textContent=msg;document.getElementById('confirm-bg').classList.add('active');document.getElementById('confirm-ok').onclick=function(){document.getElementById('confirm-bg').classList.remove('active');resolve(true)};document.getElementById('confirm-cancel').onclick=function(){document.getElementById('confirm-bg').classList.remove('active');resolve(false)}})}

async function saveMember(){var n=document.getElementById('f-name').value.trim(),p=document.getElementById('f-pw').value.trim();if(!n||!p){toast('请填写完整');return}var r=await fetch('/api/members',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,password:p})});var d=await r.json();if(d.error){toast('❌ '+d.error);return}toast('✅ '+d.message);closeModal();loadMembers();}

async function loadMembers(){var r=await fetch('/api/members');var members=await r.json();document.getElementById('member-list').innerHTML=members.map(function(m){var badge='';var ts=m.total_spent||0;if(m.is_member){if(m.consecutive_days>=3&&ts>=20)badge='🎉 88折';else if(ts>=10)badge='👤 9折';else badge='👤 消费¥'+ts.toFixed(0)+'/¥10'}else{badge='⏳ '+m.consecutive_days+'天'}return '<div class=\"card\"><div style=\"display:flex;justify-content:space-between;align-items:center;\"><div><div style=\"font-weight:600;\">'+m.name+'</div><div style=\"font-size:12px;color:var(--text-secondary);\">'+badge+' (累计 ¥'+ts.toFixed(0)+')</div></div><div style=\"display:flex;gap:6px;\"><button class=\"btn btn-sm btn-danger\" onclick=\"deleteMember('+m.id+')\">删除</button></div></div></div>'}).join('')||'<div class=\"card\" style=\"text-align:center;color:var(--text-secondary);\">暂无会员</div>';}

async function deleteMember(id){var ok=await confirmDelete('确定删除该会员？此操作不可撤销。');if(!ok)return;await fetch('/api/members/'+id+'/delete',{method:'POST'});toast('✅ 已删除');loadMembers();}
loadMembers();
</script></body></html>
