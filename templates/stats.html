<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>今日统计 - Store POS</title>
<style>body{visibility:hidden}</style><link rel="stylesheet" href="/static/style.css" onload="document.body.style.visibility='visible'">
</head>
<body style="visibility:hidden">
<div class="header">
  <h1>📊 今日统计</h1>
  <div class="sub" id="today-label">加载中...</div>
</div>

<div class="container">
  <div class="stat-grid" id="stat-cards">
    <div class="stat-card" style="border-left:3px solid var(--primary);"><div class="num" id="stat-orders">-</div><div class="label">📋 订单数</div></div>
    <div class="stat-card" style="border-left:3px solid var(--success);"><div class="num" id="stat-revenue">-</div><div class="label">💰 营收</div></div>
    <div class="stat-card" style="border-left:3px solid var(--accent);"><div class="num" id="stat-items">-</div><div class="label">📦 售出件数</div></div>
    <div class="stat-card" style="border-left:3px solid #e879f9;"><div class="num" id="stat-profit">-</div><div class="label">💸 分润</div></div>
    <div class="stat-card" style="border-left:3px solid #60a5fa;"><div class="num" id="stat-avg">-</div><div class="label">🎯 客单价</div></div>
    <div class="stat-card" style="border-left:3px solid #34d399;"><div class="num" id="stat-attach">-</div><div class="label">🔗 连带率</div></div>
    <div class="stat-card" style="border-left:3px solid #fbbf24;"><div class="num" id="stat-repeat">-</div><div class="label">🔄 复购率</div></div>
  </div>

  <!-- Payment Method Breakdown -->
  <div class="card">
    <h3>💳 支付方式</h3>
    <div id="pay-breakdown" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;">
      <div style="flex:1;min-width:80px;text-align:center;padding:10px;background:#f0fdf4;border-radius:8px;">
        <div style="font-size:10px;color:var(--text-secondary);">💰 纸币</div>
        <div style="font-size:18px;font-weight:700;color:#059669;" id="pay-cash">¥0</div>
      </div>
      <div style="flex:1;min-width:80px;text-align:center;padding:10px;background:#f0fdf4;border-radius:8px;">
        <div style="font-size:10px;color:var(--text-secondary);"><img src="/static/wechat-logo.png" style="width:12px;height:12px;vertical-align:middle;"> 微信</div>
        <div style="font-size:18px;font-weight:700;color:#059669;" id="pay-wechat">¥0</div>
      </div>
      <div style="flex:1;min-width:80px;text-align:center;padding:10px;background:#f0fdf4;border-radius:8px;">
        <div style="font-size:10px;color:var(--text-secondary);"><img src="/static/alipay-logo.png" style="width:12px;height:12px;vertical-align:middle;"> 支付宝</div>
        <div style="font-size:18px;font-weight:700;color:#059669;" id="pay-alipay">¥0</div>
      </div>
    </div>
  </div>

  <!-- Pending Orders -->
  <div class="card" id="pending-card" style="display:none;">
    <h3>⏳ 待支付订单</h3>
    <div id="pending-orders"></div>
  </div>

  <div class="card">
    <h3>🏆 今日热销</h3>
    <div id="top-products"><div style="color:var(--text-secondary);font-size:14px;">暂无数据</div></div>
    <h3 style="margin-top:16px;">🔗 商品关联分析</h3>
    <div id="associations"><div style="color:var(--text-secondary);font-size:13px;">买了X的人常买什么</div></div>
  </div>

  <div class="card">
    <h3>⏱ 最近订单</h3>
    <div id="recent-orders"><div style="color:var(--text-secondary);font-size:14px;">暂无数据</div></div>
  </div>

  <div style="display:flex;gap:8px;margin-top:4px;">
    <a href="/weekly" class="btn btn-primary" style="flex:1;text-decoration:none;text-align:center;">
      📈 本周详细
    </a>
    <a href="/api/export/orders.csv" class="btn" style="flex:1;text-decoration:none;text-align:center;background:#f1f5f9;" download>
      📥 导出订单 CSV
    </a>
    <a href="/api/export/products.csv" class="btn" style="flex:1;text-decoration:none;text-align:center;background:#f1f5f9;" download>
      📥 导出商品 CSV
    </a>
  </div>
</div>

<nav class="tab-bar">
  <a href="/"><span class="icon">🧾</span>收银</a>
  <a href="/products"><span class="icon">📦</span>商品</a>
  <a href="/orders"><span class="icon">📋</span>订单</a>
  <a href="/members"><span class="icon">👤</span>会员</a>
  <a href="/stats" class="active"><span class="icon">📊</span>统计</a>
  <a href="/lucky"><span class="icon">🎰</span>抽奖</a>
</nav>

<script>
async function loadStats() {
  const res = await fetch('/api/stats/today');
  const d = await res.json();

  document.getElementById('today-label').textContent = d.date;
  document.getElementById('stat-orders').textContent = d.order_count;
  document.getElementById('stat-revenue').textContent = '¥' + d.revenue.toFixed(2);
  document.getElementById('stat-items').textContent = d.items_sold;
  document.getElementById('stat-profit').textContent = '¥' + (d.profit_share||0).toFixed(2);
  document.getElementById('stat-avg').textContent = '¥' + (d.avg_order||0).toFixed(2);
  document.getElementById('stat-attach').textContent = (d.attach_rate||0).toFixed(1) + '件';
  document.getElementById('stat-repeat').textContent = (d.repeat_rate||0) + '%';

  // Payment breakdown
  const payMap = { cash: 0, wechat: 0, alipay: 0 };
  d.payment_breakdown.forEach(p => { payMap[p.method] = p.total; });
  document.getElementById('pay-cash').textContent = '¥' + (payMap.cash || 0).toFixed(2);
  document.getElementById('pay-wechat').textContent = '¥' + (payMap.wechat || 0).toFixed(2);
  document.getElementById('pay-alipay').textContent = '¥' + (payMap.alipay || 0).toFixed(2);

  // Pending orders
  const pendingEl = document.getElementById('pending-orders');
  const pendingCard = document.getElementById('pending-card');
  if (d.pending_orders && d.pending_orders.length > 0) {
    pendingCard.style.display = 'block';
    pendingEl.innerHTML = d.pending_orders.map(o =>
      `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px;">
        <a href="/orders" style="text-decoration:none;color:var(--primary);font-weight:600;">#${o.id}</a>
        <span style="font-weight:600;">¥${o.total_amount.toFixed(2)}</span>
      </div>`
    ).join('');
  } else {
    pendingCard.style.display = 'none';
  }

  // Top products
  const topEl = document.getElementById('top-products');
  if (d.top_products.length === 0) {
    topEl.innerHTML = '<div style="color:var(--text-secondary);font-size:14px;">暂无销售</div>';
  } else {
    topEl.innerHTML = d.top_products.map(p => `
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
        <span>${p.product_name}</span>
        <span style="font-weight:600;">${p.qty}件 · ¥${parseFloat(p.total).toFixed(2)}</span>
      </div>
    `).join('');
  }

  // Recent orders
  const recentEl = document.getElementById('recent-orders');
  if (d.recent_orders.length === 0) {
    recentEl.innerHTML = '<div style="color:var(--text-secondary);font-size:14px;">暂无订单</div>';
  } else {
    recentEl.innerHTML = d.recent_orders.map(o => {
      const payTag = o.payment_method ? `${o.status === 'pending' ? '⏳' : '✅'} ${o.payment_method}` : (o.status === 'pending' ? '⏳ 待支付' : '✅');
      return `
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px;">
        <span>
          <span style="color:var(--text-secondary);">#${o.id} · ${(o.created_at||'').slice(11,16)}</span>
          <span style="font-size:11px;color:#666;margin-left:4px;">${payTag}</span>
        </span>
        <span style="font-weight:600;">${o.item_count}件 · ¥${o.total_amount.toFixed(2)}</span>
      </div>`;
    }).join('');
  }
}

loadStats();
(async function(){
  try{
    var r=await fetch('/api/stats/associations');
    var d=await r.json();
    var el=document.getElementById('associations');
    el.innerHTML=d.length?d.map(function(a){
      return '<div style="padding:4px 0;border-bottom:1px solid var(--border);"><b style="color:var(--primary);">'+a.p1+'</b> → <b style="color:var(--accent);">'+a.p2+'</b> <span style="color:var(--text-muted);">('+a.cnt+'次)</span></div>';
    }).join(''):'<div style="color:var(--text-secondary);">今日暂无关联数据</div>';
  }catch(e){}
})();
</script>
<div class="version-badge">v2.6.3</div>

</script>
</body>
</html>
