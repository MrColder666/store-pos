<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>商品管理 - Store POS</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="header">
  <h1>📦 商品管理</h1>
  <div class="sub">管理商品信息与库存</div>
</div>

<div class="container">
  <button class="btn btn-primary btn-block" onclick="openAdd()">＋ 新增商品</button>
  <div style="margin-top:12px;" id="products-list"></div>
</div>

<nav class="tab-bar">
  <a href="/"><span class="icon">🧾</span>收银</a>
  <a href="/products" class="active"><span class="icon">📦</span>商品</a>
  <a href="/orders"><span class="icon">📋</span>订单</a>
  <a href="/stats"><span class="icon">📊</span>统计</a>
</nav>

<!-- Modal -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h2 id="modal-title">新增商品</h2>
    <div class="form-group">
      <label>商品名称 *</label>
      <input class="form-input" id="f-name" placeholder="例：美式咖啡">
    </div>
    <div class="form-group">
      <label>价格 *</label>
      <input class="form-input" id="f-price" type="number" step="0.01" min="0" placeholder="0.00">
    </div>
    <div class="form-group">
      <label>分类</label>
      <input class="form-input" id="f-category" placeholder="例：饮品、甜品">
    </div>
    <div class="form-group">
      <label>库存</label>
      <input class="form-input" id="f-stock" type="number" min="0" placeholder="0">
    </div>
    <div class="form-group">
      <label>折扣 (0-100%)</label>
      <input class="form-input" id="f-discount" type="number" min="0" max="100" placeholder="0 = 无折扣">
    </div>
    <div class="btn-row">
      <button class="btn" style="background:#f1f5f9;" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="modal-save" onclick="saveProduct()">保存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Confirm Modal -->
<div class="modal-bg" id="confirm-bg">
  <div class="modal">
    <h2>⚠️ 确认删除</h2>
    <p style="color:var(--text-secondary);margin-bottom:16px;" id="confirm-msg">确定要删除该商品吗？</p>
    <div class="btn-row">
      <button class="btn" style="background:#f1f5f9;" id="confirm-cancel">取消</button>
      <button class="btn btn-danger" id="confirm-ok">删除</button>
    </div>
  </div>
</div>

<script>
let editingId = null;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show';
  setTimeout(() => t.className = 'toast', 2000);
}

function confirmDialog(msg) {
  return new Promise(resolve => {
    document.getElementById('confirm-msg').textContent = msg;
    document.getElementById('confirm-bg').classList.add('active');
    var okBtn = document.getElementById('confirm-ok');
    var cancelBtn = document.getElementById('confirm-cancel');
    okBtn.onclick = function() {
      closeConfirm();
      resolve(true);
    };
    cancelBtn.onclick = function() {
      closeConfirm();
      resolve(false);
    };
  });
}

function closeConfirm() {
  document.getElementById('confirm-bg').classList.remove('active');
}

async function loadProducts() {
  const res = await fetch('/api/products');
  const products = await res.json();
  const el = document.getElementById('products-list');
  el.innerHTML = products.map(p => {
    const hasDiscount = p.discount > 0;
    const finalPrice = hasDiscount ? p.price * (100 - p.discount) / 100 : p.price;
    return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:start;">
        <div>
          <div style="font-weight:600;font-size:15px;">${p.name}</div>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">
            ${p.category ? p.category + ' · ' : ''}库存: ${p.stock}
          </div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:18px;font-weight:700;color:var(--primary);">
            ${hasDiscount ? `<span style="text-decoration:line-through;color:#999;font-size:13px;font-weight:400;">¥${p.price.toFixed(2)}</span> ` : ''}
            ¥${finalPrice.toFixed(2)}
            ${hasDiscount ? `<span style="font-size:11px;color:#e53e3e;background:#fee;padding:1px 5px;border-radius:4px;">-${p.discount}%</span>` : ''}
          </div>
          <div style="margin-top:6px;display:flex;gap:6px;justify-content:end;">
            <button class="btn btn-sm" style="background:#f1f5f9;" onclick="editProduct(${p.id})">编辑</button>
            <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">删除</button>
          </div>
        </div>
      </div>
    </div>
  `}).join('');
}

function openAdd() {
  editingId = null;
  document.getElementById('modal-title').textContent = '新增商品';
  document.getElementById('f-name').value = '';
  document.getElementById('f-price').value = '';
  document.getElementById('f-category').value = '';
  document.getElementById('f-stock').value = '';
  document.getElementById('f-discount').value = '';
  document.getElementById('modal-bg').classList.add('active');
}

function editProduct(id) {
  editingId = id;
  document.getElementById('modal-title').textContent = '编辑商品';
  // Find product data
  fetch('/api/products').then(r => r.json()).then(products => {
    const p = products.find(x => x.id === id);
    if (!p) return;
    document.getElementById('f-name').value = p.name;
    document.getElementById('f-price').value = p.price;
    document.getElementById('f-category').value = p.category;
    document.getElementById('f-stock').value = p.stock;
    document.getElementById('f-discount').value = p.discount || 0;
    document.getElementById('modal-bg').classList.add('active');
  });
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('active');
}

async function saveProduct() {
  const name = document.getElementById('f-name').value.trim();
  const price = parseFloat(document.getElementById('f-price').value);
  const category = document.getElementById('f-category').value.trim();
  const stock = parseInt(document.getElementById('f-stock').value) || 0;
  const discount = parseInt(document.getElementById('f-discount').value) || 0;

  if (!name) { toast('请输入商品名称'); return; }
  if (isNaN(price) || price < 0) { toast('请输入有效价格'); return; }
  if (discount < 0 || discount > 100) { toast('折扣范围 0-100'); return; }

  const url = editingId ? `/api/products/${editingId}` : '/api/products';
  const method = editingId ? 'PUT' : 'POST';

  const res = await fetch(url, {
    method,
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ name, price, category, stock, discount })
  });
  const data = await res.json();
  if (data.error) { toast('❌ ' + data.error); return; }

  toast(editingId ? '✅ 已更新' : '✅ 已新增');
  closeModal();
  loadProducts();
}

async function deleteProduct(id) {
  const confirmed = await confirmDialog('确定删除该商品吗？此操作不可撤销。');
  if (!confirmed) return;
  const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
  const data = await res.json();
  if (data.ok) { toast('✅ 已删除'); loadProducts(); }
}

loadProducts();
</script>
</body>
</html>
