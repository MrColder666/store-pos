<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>商品管理 - Store POS</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="header">
  <h1>📦 商品管理</h1>
  <div class="sub">管理商品信息与库存</div>
</div>

<div class="container">
  <button class="btn btn-primary btn-block" onclick="openAdd()">＋ 新增商品</button>
  <div style="margin-top:12px;" id="products-list"></div>
  <button class="btn btn-accent btn-block" id="btn-save-order" style="display:none;margin-top:8px;" onclick="saveOrder()">💾 保存排序</button>
</div>

<nav class="tab-bar">
  <a href="/"><span class="icon">🧾</span>收银</a>
  <a href="/products" class="active"><span class="icon">📦</span>商品</a>
  <a href="/orders"><span class="icon">📋</span>订单</a>  <a href="/lucky"><span class="icon">🎰</span>抽奖</a>
  <a href="/stats"><span class="icon">📊</span>统计</a></nav>

<!-- Modal -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h2 id="modal-title">新增商品</h2>
    <div class="form-group">
      <label>商品名称 *</label>
      <input class="form-input" id="f-name" placeholder="例：美式咖啡">
    </div>
    <div class="form-group">
      <label>价格 *</label>
      <input class="form-input" id="f-price" type="number" step="0.01" min="0" placeholder="0.00">
    </div>
    <div class="form-group">
      <label>分类</label>
      <input class="form-input" id="f-category" placeholder="例：饮品、甜品">
    </div>
    <div class="form-group">
      <label>库存</label>
      <input class="form-input" id="f-stock" type="number" min="0" placeholder="0">
    </div>
    <div class="form-group" style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
      <input type="checkbox" id="f-is-coupon" onchange="toggleCoupon()" style="width:18px;height:18px;accent-color:var(--primary);">
      <label for="f-is-coupon" style="cursor:pointer;font-weight:600;font-size:13px;margin:0;">🎫 优惠券（密码加入购物车，价格将设为 ¥0）</label>
    </div>
    <div class="form-group" id="coupon-section" style="display:none;">
      <label>优惠方式</label>
      <select class="form-input" id="f-coupon-mode" onchange="updateCouponLabel()">
        <option value="total">整体减价（减订单总额）</option>
        <option value="item">单品减价（指定购物车中某件商品）</option>
      </select>
    </div>
    <div class="form-group" id="discount-section">
      <label id="f-discount-label">折扣百分比</label>
      <select class="form-input" id="f-discount-type" onchange="updateDiscountInput()">
        <option value="percent">百分比 (%)</option>
        <option value="fixed">固定减价 (¥)</option>
      </select>
      <div style="margin-top:4px;"></div>
      <input class="form-input" id="f-discount" type="number" min="0" step="0.1" placeholder="0 = 无折扣">
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="modal-save" onclick="saveProduct()">保存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="version-badge">v2.3.3</div>
<div class="toast" id="toast"></div>

<!-- Confirm Modal -->
<div class="modal-bg" id="confirm-bg">
  <div class="modal">
    <h2>⚠️ 确认删除</h2>
    <p style="color:var(--text-secondary);margin-bottom:16px;" id="confirm-msg">确定要删除该商品吗？</p>
    <div class="btn-row">
      <button class="btn btn-ghost" id="confirm-cancel">取消</button>
      <button class="btn btn-danger" id="confirm-ok">删除</button>
    </div>
  </div>
</div>

<!-- Options Modal -->
<div class="modal-bg" id="opt-bg">
  <div class="modal" style="max-height:80vh;overflow-y:auto;">
    <h2 id="opt-title">选项配置</h2>
    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">添加选项组（如尺寸、甜度），顾客下单时需选择</p>
    <div id="opt-groups"></div>
    <button class="btn btn-sm btn-ghost" style="width:100%;margin-bottom:12px;" onclick="addOptionGroup()">＋ 添加选项组</button>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeOptModal()">取消</button>
      <button class="btn btn-primary" onclick="saveOptions()">保存选项</button>
    </div>
  </div>
</div>

<script>
let editingId = null;
let optProductId = null;
let optData = [];

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show';
  setTimeout(() => t.className = 'toast', 2000);
}

function confirmDialog(msg) {
  return new Promise(resolve => {
    document.getElementById('confirm-msg').textContent = msg;
    document.getElementById('confirm-bg').classList.add('active');
    var okBtn = document.getElementById('confirm-ok');
    var cancelBtn = document.getElementById('confirm-cancel');
    okBtn.onclick = function() { closeConfirm(); resolve(true); };
    cancelBtn.onclick = function() { closeConfirm(); resolve(false); };
  });
}

function closeConfirm() { document.getElementById('confirm-bg').classList.remove('active'); }

function toggleCoupon() {
  const isCoupon = document.getElementById('f-is-coupon').checked;
  document.getElementById('coupon-section').style.display = isCoupon ? 'block' : 'none';
  const priceEl = document.getElementById('f-price');
  if (isCoupon) {
    priceEl.value = '0';
    priceEl.disabled = true;
    priceEl.style.background = '#f1f5f9';
    document.getElementById('f-discount-label').textContent = '优惠券面值';
    updateDiscountInput();
    updateCouponLabel();
  } else {
    priceEl.disabled = false;
    priceEl.style.background = '';
    updateDiscountInput();
  }
}
function updateCouponLabel() {
  const mode = document.getElementById('f-coupon-mode').value;
  const label = document.getElementById('f-discount-label');
  if (mode === 'item') {
    label.textContent = '优惠券面值（每件减）';
  } else {
    label.textContent = '优惠券面值（减总额）';
  }
}

function updateDiscountInput() {
  const dt = document.getElementById('f-discount-type').value;
  const label = document.getElementById('f-discount-label');
  const input = document.getElementById('f-discount');
  const isCoupon = document.getElementById('f-is-coupon').checked;
  if (isCoupon) {
    label.textContent = dt === 'percent' ? '优惠券面值 (%)' : '优惠券面值 (¥)';
    input.step = dt === 'percent' ? '0.1' : '0.01';
    input.placeholder = dt === 'percent' ? '例: 20 表示 20% off' : '例: 3 表示减 ¥3';
    if (dt === 'percent') input.max = '100'; else input.removeAttribute('max');
    return;
  }
  if (dt === 'percent') {
    label.textContent = '折扣百分比';
    input.step = '0.1';
    input.max = '100';
    input.placeholder = '0 = 无折扣';
  } else {
    label.textContent = '减少金额 (¥)';
    input.step = '0.01';
    input.removeAttribute('max');
    input.placeholder = '0.00';
  }
  input.value = '';
}

async function loadProducts() {
  const res = await fetch('/api/products');
  const products = await res.json();
  productOrder = products;
  if (!window._orderOverride) window._orderOverride = null;
  renderOrderedProducts();
}

function openAdd() {
  editingId = null;
  document.getElementById('modal-title').textContent = '新增商品';
  document.getElementById('f-name').value = '';
  document.getElementById('f-price').value = '';
  document.getElementById('f-category').value = '';
  document.getElementById('f-stock').value = '';
  document.getElementById('f-discount').value = '';
  document.getElementById('f-discount-type').value = 'percent';
  document.getElementById('f-is-coupon').checked = false;
  document.getElementById('f-coupon-mode').value = 'total';
  updateDiscountInput();
  toggleCoupon();
  document.getElementById('modal-bg').classList.add('active');
}

function editProduct(id) {
  editingId = id;
  document.getElementById('modal-title').textContent = '编辑商品';
  fetch('/api/products').then(r => r.json()).then(products => {
    const p = products.find(x => x.id === id);
    if (!p) return;
    document.getElementById('f-name').value = p.name;
    document.getElementById('f-price').value = p.price;
    document.getElementById('f-category').value = p.category;
    document.getElementById('f-stock').value = p.stock;
    document.getElementById('f-discount-type').value = p.discount_type || 'percent';
    updateDiscountInput();
    document.getElementById('f-discount').value = p.discount || 0;
    document.getElementById('f-is-coupon').checked = p.is_coupon ? true : false;
    document.getElementById('f-coupon-mode').value = p.coupon_mode || 'total';
    toggleCoupon();
    document.getElementById('modal-bg').classList.add('active');
  });
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('active');
}

async function saveProduct() {
  const name = document.getElementById('f-name').value.trim();
  let price = parseFloat(document.getElementById('f-price').value);
  const category = document.getElementById('f-category').value.trim();
  const stock = parseInt(document.getElementById('f-stock').value) || 0;
  const discount = parseFloat(document.getElementById('f-discount').value) || 0;
  const discount_type = document.getElementById('f-discount-type').value;
  const is_coupon = document.getElementById('f-is-coupon').checked;
  const coupon_mode = document.getElementById('f-coupon-mode').value;
  if (is_coupon) price = 0;

  if (!name) { toast('请输入商品名称'); return; }
  if (isNaN(price) || price < 0) { toast('请输入有效价格'); return; }
  if (discount < 0) { toast('折扣不能为负数'); return; }
  if (discount_type === 'percent' && discount > 100) { toast('百分比折扣不能超过 100%'); return; }

  const url = editingId ? `/api/products/${editingId}` : '/api/products';
  const method = editingId ? 'PUT' : 'POST';

  const res = await fetch(url, {
    method,
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ name, price, category, stock, discount, discount_type, is_coupon, coupon_mode })
  });
  const data = await res.json();
  if (data.error) { toast('❌ ' + data.error); return; }

  toast(editingId ? '✅ 已更新' : '✅ 已新增');
  closeModal();
  loadProducts();
}

async function deleteProduct(id) {
  const confirmed = await confirmDialog('确定删除该商品吗？此操作不可撤销。');
  if (!confirmed) return;
  const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
  const data = await res.json();
  if (data.ok) { toast('✅ 已删除'); loadProducts(); }
}

// ── Options Management ─────────────────────────────────────────
function closeOptModal() { document.getElementById('opt-bg').classList.remove('active'); }

function manageOptions(pid, name) {
  optProductId = pid;
  document.getElementById('opt-title').textContent = `⚙️ ${name} — 选项配置`;
  fetch(`/api/products/${pid}/options`)
    .then(r => r.json())
    .then(groups => {
      optData = groups;
      renderOptionGroups(optData);
      document.getElementById('opt-bg').classList.add('active');
    });
}

function renderOptionGroups(groups) {
  const el = document.getElementById('opt-groups');
  if (groups.length === 0) {
    el.innerHTML = '<div style="color:var(--text-secondary);font-size:14px;text-align:center;padding:20px;">暂无选项，点击下方按钮添加</div>';
    return;
  }
  el.innerHTML = groups.map((g, gi) => `
    <div class="card" style="margin-bottom:8px;padding:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <input class="form-input" style="font-weight:600;width:auto;flex:1;margin-right:8px;" value="${g.group_name}" placeholder="选项组名称（如尺寸）" onchange="optData[${gi}].group_name=this.value">
        <button class="btn btn-sm btn-danger" onclick="removeOptionGroup(${gi})" style="font-size:12px;">✕</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <label style="font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;color:var(--text-secondary);">
          <input type="checkbox" ${g.multi_select ? 'checked' : ''} onchange="optData[${gi}].multi_select=this.checked" style="width:16px;height:16px;accent-color:var(--primary);">
          允许多选（顾客可同时勾选多个选项）
        </label>
      </div>
      <div>
        ${g.options.map((o, oi) => `
          <div style="display:flex;gap:6px;margin-bottom:4px;align-items:center;">
            <input class="form-input" style="flex:2;font-size:13px;padding:6px 8px;" value="${o.option_name}" placeholder="选项名" onchange="optData[${gi}].options[${oi}].option_name=this.value">
            <input class="form-input" style="flex:1;font-size:13px;padding:6px 8px;" type="number" min="0" step="0.5" value="${o.price_adjustment}" placeholder="加价" onchange="optData[${gi}].options[${oi}].price_adjustment=parseFloat(this.value)||0">
            <span style="font-size:12px;color:var(--text-secondary);white-space:nowrap;">加价</span>
            <button class="btn btn-sm btn-danger" onclick="removeOption(${gi},${oi})" style="font-size:12px;padding:3px 8px;">✕</button>
          </div>
        `).join('')}
      </div>
      <button class="btn btn-sm btn-ghost" style="margin-top:4px;font-size:12px;" onclick="addOption(${gi})">＋ 添加选项</button>
    </div>
  `).join('');
}

function addOptionGroup() {
  optData.push({ group_name: '', multi_select: false, options: [{ option_name: '', price_adjustment: 0 }] });
  renderOptionGroups(optData);
}
function removeOptionGroup(gi) { optData.splice(gi, 1); renderOptionGroups(optData); }
function addOption(gi) { optData[gi].options.push({ option_name: '', price_adjustment: 0 }); renderOptionGroups(optData); }
function removeOption(gi, oi) { optData[gi].options.splice(oi, 1); renderOptionGroups(optData); }

async function saveOptions() {
  for (const g of optData) {
    if (!g.group_name.trim()) { toast('❌ 选项组名称不能为空'); return; }
    for (const o of g.options) {
      if (!o.option_name.trim()) { toast('❌ 选项名称不能为空'); return; }
    }
  }
  const res = await fetch(`/api/products/${optProductId}/options`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(optData)
  });
  const data = await res.json();
  if (data.ok) { toast('✅ 选项已保存'); closeOptModal(); }
  else { toast('❌ 保存失败'); }
}

loadProducts();
let productOrder = [];

function moveProduct(idx, dir) {
  const products = window._orderOverride || productOrder;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= products.length) return;
  [products[idx], products[newIdx]] = [products[newIdx], products[idx]];
  window._orderOverride = products;
  document.getElementById('btn-save-order').style.display = 'block';
  renderOrderedProducts();
}

function renderOrderedProducts() {
  const products = window._orderOverride || productOrder;
  const el = document.getElementById('products-list');
  el.innerHTML = products.map((p, i) => {
    const hasDiscount = p.discount > 0;
    const isFixed = p.discount_type === 'fixed';
    let finalPrice = p.price;
    if (hasDiscount) { if (isFixed) finalPrice = Math.max(0, p.price - p.discount); else finalPrice = p.price * (100 - p.discount) / 100; }
    const discountBadge = hasDiscount ? (isFixed ? '<span class="discount-badge discount-badge-fixed">-¥'+parseFloat(p.discount).toFixed(2)+'</span>' : '<span class="discount-badge discount-badge-percent">-'+parseFloat(p.discount).toFixed(1)+'%</span>') : '';
    return '<div class="card" style="display:flex;align-items:start;gap:8px;"><div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:4px;min-width:28px;"><button class="btn btn-sm" style="padding:2px 6px;font-size:10px;line-height:1;" onclick="moveProduct('+i+',-1)" '+(i===0?'disabled':'')+'>▲</button><span style="font-size:14px;color:var(--text-muted);">☰</span><button class="btn btn-sm" style="padding:2px 6px;font-size:10px;line-height:1;" onclick="moveProduct('+i+',1)" '+(i===products.length-1?'disabled':'')+'>▼</button></div><div style="flex:1;"><div style="display:flex;justify-content:space-between;align-items:start;"><div><div style="font-weight:600;font-size:15px;">'+p.name+'</div><div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">'+(p.category?p.category+' · ':'')+'库存: '+p.stock+'</div></div><div style="text-align:right;"><div style="font-size:18px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:6px;justify-content:flex-end;flex-wrap:wrap;">'+(hasDiscount?'<span style="text-decoration:line-through;color:var(--text-muted);font-size:13px;font-weight:400;">¥'+p.price.toFixed(2)+'</span> ':'')+'<span>¥'+finalPrice.toFixed(2)+'</span>'+discountBadge+'</div><div style="margin-top:8px;display:flex;gap:6px;justify-content:end;"><button class="btn btn-sm btn-ghost" onclick="editProduct('+p.id+')">编辑</button><button class="btn btn-sm" style="background:#eef2ff;color:#6366f1;" onclick="manageOptions('+p.id+',\''+p.name.replace(/\x27/g,'\\\x27')+'\')">选项</button><button class="btn btn-sm btn-danger" onclick="deleteProduct('+p.id+')">删除</button></div></div></div></div></div>';
  }).join('');
}

async function saveOrder() {
  const products = window._orderOverride || productOrder;
  const ids = products.map(p => p.id);
  const res = await fetch('/api/products/reorder', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ids}) });
  const data = await res.json();
  if (data.ok) { toast('✅ 排序已保存'); document.getElementById('btn-save-order').style.display='none'; window._orderOverride=null; loadProducts(); }
  else toast('❌ 保存失败');
}

</script>
<script>
(function(){document.body.addEventListener('click',function(e){var t=e.target.closest('button');if(!t||t.disabled)return;try{var a=new(window.AudioContext||window.webkitAudioContext)();a.resume();var o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=800;g.gain.setValueAtTime(0.03,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.04);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+0.04)}catch(e){}})})();
</script>
</body>
</html>
