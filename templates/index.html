<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>收银台 - Store POS</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="header">
  <h1>🧾 收银台</h1>
  <div class="sub">选择商品 → 结算出单</div>
</div>

<div class="container">
  <!-- Checkout Area -->
  <div class="card">
    <h3>🛒 购物车</h3>
    <div id="cart-items">
      <div style="text-align:center;color:var(--text-secondary);padding:20px;font-size:14px;">
        购物车为空，请从下方选择商品
      </div>
    </div>
    <div class="cart-total" id="cart-total">¥0.00</div>
    <div class="form-group" style="margin-bottom:8px;">
      <input class="form-input" id="order-note" placeholder="备注（选填）" style="font-size:13px;padding:8px 10px;">
    </div>
    <button class="btn btn-success btn-block" id="btn-checkout" disabled onclick="checkout()">
      ✅ 结算
    </button>
  </div>

  <!-- Search -->
  <div class="search-bar">
    <span class="icon">🔍</span>
    <input type="text" id="search-input" placeholder="搜索商品..." oninput="loadProducts()">
  </div>

  <!-- Products Grid -->
  <div id="products-list"></div>
</div>

<!-- Tab Bar -->
<nav class="tab-bar">
  <a href="/" class="active"><span class="icon">🧾</span>收银</a>
  <a href="/products"><span class="icon">📦</span>商品</a>
  <a href="/orders"><span class="icon">📋</span>订单</a>
  <a href="/stats"><span class="icon">📊</span>统计</a>
</nav>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Option Select Modal -->
<div class="modal-bg" id="opt-select-bg">
  <div class="modal" style="max-height:80vh;overflow-y:auto;">
    <h2 id="opt-select-title">选择选项</h2>
    <div id="opt-select-body"></div>
    <div class="btn-row" style="margin-top:12px;">
      <button class="btn" style="background:#f1f5f9;" onclick="closeOptSelect()">取消</button>
      <button class="btn btn-primary" onclick="confirmOptions()">确认添加</button>
    </div>
  </div>
</div>

<script>
let cart = [];

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show';
  setTimeout(() => t.className = 'toast', 2000);
}

async function loadProducts() {
  const search = document.getElementById('search-input').value;
  const res = await fetch('/api/products?search=' + encodeURIComponent(search));
  const products = await res.json();
  const el = document.getElementById('products-list');
  el.innerHTML = products.map(p => {
    const hasDiscount = p.discount > 0;
    const finalPrice = hasDiscount ? p.price * (100 - p.discount) / 100 : p.price;
    return `
    <div class="card" style="cursor:pointer;padding:12px 16px;" onclick="clickProduct(${p.id},'${p.name.replace(/'/g,"\\'")}',${finalPrice},${p.discount||0},${p.price})">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-weight:600;font-size:15px;">${p.name}</div>
          <div style="font-size:12px;color:var(--text-secondary);">库存: ${p.stock} · ${p.category}</div>
        </div>
        <div style="font-size:18px;font-weight:700;color:var(--primary);">
          ${hasDiscount ? `<span style="text-decoration:line-through;color:#999;font-size:12px;font-weight:400;">¥${p.price.toFixed(2)}</span> ` : ''}
          ¥${finalPrice.toFixed(2)}
          ${hasDiscount ? `<span style="font-size:10px;color:#e53e3e;background:#fee;padding:1px 4px;border-radius:3px;">-${p.discount}%</span>` : ''}
        </div>
      </div>
    </div>
  `}).join('');
}

function addToCart(id, name, price, optStr) {
  const existing = cart.find(c => c.id === id && c.optStr === optStr);
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ id, name, price, qty: 1, optStr: optStr || '' });
  }
  renderCart();
  toast(`已添加 ${name}`);
}

// ── Option Selection ──────────────────────────────────────────
let pendingProduct = null;
let selectedOptions = {};

function clickProduct(id, name, finalPrice, discount, origPrice) {
  fetch(`/api/products/${id}/options`).then(r => r.json()).then(opts => {
    if (opts.length === 0) { addToCart(id, name, finalPrice, ''); return; }
    pendingProduct = { id, name, price: finalPrice };
    document.getElementById('opt-select-title').textContent = `⚙️ ${name} — 选择选项`;
    selectedOptions = {};
    const body = document.getElementById('opt-select-body');
    body.innerHTML = '';
    opts.forEach(g => {
      let html = `<div style="margin-bottom:12px;"><div style="font-weight:600;font-size:14px;margin-bottom:6px;">${g.group_name}</div>`;
      g.options.forEach((o, oi) => {
        const adj = o.price_adjustment > 0 ? `+¥${o.price_adjustment.toFixed(2)}` : '';
        html += `<div class="opt-item" data-group="${g.group_name}" data-option="${o.option_name}" data-price="${o.price_adjustment}" onclick="selectOpt(this)" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid #e2e8f0;border-radius:6px;margin-bottom:4px;cursor:pointer;">`;
        html += `<span style="flex:1;">${o.option_name}</span>${adj ? `<span style="color:var(--primary);font-size:13px;">${adj}</span>` : ''}</div>`;
      });
      html += '</div>';
      body.innerHTML += html;
    });
    document.getElementById('opt-select-bg').classList.add('active');
  });
}

function selectOpt(el) {
  const group = el.getAttribute('data-group');
  const option = el.getAttribute('data-option');
  const priceAdj = parseFloat(el.getAttribute('data-price')) || 0;
  selectedOptions[group] = { option, priceAdj };
  // Highlight selected
  el.parentElement.querySelectorAll('.opt-item').forEach(item => item.style.background = '#fff');
  el.style.background = '#eef2ff';
}

function closeOptSelect() {
  document.getElementById('opt-select-bg').classList.remove('active');
  pendingProduct = null;
}

function confirmOptions() {
  const groups = document.getElementById('opt-select-body').children;
  for (const g of groups) {
    const gname = g.querySelector('div:first-child').textContent;
    if (!selectedOptions[gname]) { toast(`❌ 请选择「${gname}」`); return; }
  }
  let extra = 0;
  const strs = [];
  for (const k in selectedOptions) {
    extra += selectedOptions[k].priceAdj;
    strs.push(selectedOptions[k].option);
  }
  addToCart(pendingProduct.id, pendingProduct.name, pendingProduct.price + extra, strs.join(' / '));
  closeOptSelect();
}

function renderCart() {
  const el = document.getElementById('cart-items');
  const totalEl = document.getElementById('cart-total');
  const btn = document.getElementById('btn-checkout');

  if (cart.length === 0) {
    el.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:20px;font-size:14px;">购物车为空，请从下方选择商品</div>';
    totalEl.textContent = '¥0.00';
    btn.disabled = true;
    return;
  }

  let total = 0;
  el.innerHTML = cart.map((c, i) => {
    const sub = c.price * c.qty;
    total += sub;
    return `
      <div class="cart-item">
        <div>
          <div style="font-weight:600;">${c.name}</div>
          ${c.optStr ? `<div style="font-size:11px;color:#6366f1;">📋 ${c.optStr}</div>` : ''}
          <div style="font-size:12px;color:var(--text-secondary);">¥${c.price.toFixed(2)}</div>
        </div>
        <div class="cart-qty">
          <button onclick="changeQty(${i},-1)">−</button>
          <span style="font-weight:700;min-width:20px;text-align:center;">${c.qty}</span>
          <button onclick="changeQty(${i},1)">+</button>
          <button onclick="changeQty(${i},-999)" style="border-color:#fee2e2;color:var(--danger);">✕</button>
        </div>
      </div>
    `;
  }).join('');
  totalEl.textContent = `¥${total.toFixed(2)}`;
  btn.disabled = false;
}

function changeQty(idx, delta) {
  if (cart[idx].qty + delta <= 0) {
    cart.splice(idx, 1);
  } else {
    cart[idx].qty += delta;
  }
  renderCart();
}

async function checkout() {
  if (cart.length === 0) return;
  const btn = document.getElementById('btn-checkout');
  btn.disabled = true;
  btn.textContent = '⏳ 结算中...';

  try {
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        items: cart.map(c => ({ product_id: c.id, quantity: c.qty, options_str: c.optStr || '' })),
        note: document.getElementById('order-note').value.trim()
      })
    });
    const data = await res.json();
    if (data.error) {
      toast('❌ ' + data.error);
      btn.textContent = '✅ 结算';
      btn.disabled = false;
      return;
    }
    toast(`✅ 结算成功！订单 #${data.order_id}  ¥${data.total.toFixed(2)}`);
    cart = [];
    renderCart();
    loadProducts();
  } catch (e) {
    toast('❌ 网络错误');
    btn.textContent = '✅ 结算';
    btn.disabled = false;
  }
}

loadProducts();
</script>
</body>
</html>
