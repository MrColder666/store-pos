<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e1b4b">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>收银台 - Store POS</title>
<style>body{visibility:hidden}</style><link rel="stylesheet" href="/static/style.css" onload="document.body.style.visibility='visible'">

</head>
<body style="visibility:hidden">

<button onclick="toggleFS()" style="position:fixed;top:8px;right:8px;z-index:999;background:rgba(124,58,237,0.8);color:#fff;border:none;border-radius:8px;padding:4px 8px;font-size:16px;cursor:pointer;">⛶</button>
<div class="header">
  <h1>🧾 收银台</h1>
  <div class="sub">选择商品 → 选择支付方式 → 收款</div>
</div>
<div class="container">
  <!-- Checkout Area -->
  <div class="card">
    <h3>🛒 购物车</h3>
    <div id="cart-items">
      <div style="text-align:center;color:var(--text-secondary);padding:20px;font-size:14px;">
        购物车为空，请从下方选择商品
      </div>
    </div>
    <div class="cart-total" id="cart-total">¥0.00</div>
    <div class="form-group" style="margin-bottom:8px;">
      <input class="form-input" id="order-note" placeholder="备注（选填）" style="font-size:13px;padding:8px 10px;">
    </div>
    <button class="btn btn-success btn-block" id="btn-checkout" disabled onclick="openPayModal()">
      💳 去结算
    </button>
  </div>
  <!-- Search -->
  <div class="search-bar">
    <span class="icon">🔍</span>
    <input type="text" id="search-input" placeholder="搜索商品..." oninput="loadProducts()">
  </div>
  <!-- Products Grid -->
  <div id="products-list"></div>
</div>
<!-- Tab Bar -->
<nav class="tab-bar">
  <a href="/" class="active"><span class="icon">🧾</span>收银</a>
  <a href="/products"><span class="icon">📦</span>商品</a>
  <a href="/orders"><span class="icon">📋</span>订单</a>
  <a href="/members"><span class="icon">👤</span>会员</a>
  <a href="/stats"><span class="icon">📊</span>统计</a>
  <a href="/lucky"><span class="icon">🎰</span>抽奖</a>
</nav>
<!-- Toast -->
<div class="toast" id="toast"></div>
<div class="version-badge">v2.4.2</div>
<!-- Coupon Password Modal -->
<div class="modal-bg" id="coupon-pw-bg">
  <div class="modal" style="text-align:center;max-width:360px;">
    <h2 id="coupon-pw-title">🎫 输入优惠券密码</h2>
    <input class="form-input" id="coupon-pw-input" type="password" placeholder="请输入密码" style="text-align:center;font-size:18px;margin-bottom:12px;">
    <div class="btn-row">
      <button class="btn" style="background:#f1f5f9;" onclick="closeCouponPw()">取消</button>
      <button class="btn btn-primary" onclick="confirmCouponPw()">确认</button>
    </div>
  </div>
</div>
<!-- Coupon Item Select Modal (per-item mode) -->
<div class="modal-bg" id="coupon-item-bg">
  <div class="modal" style="max-height:80vh;overflow-y:auto;">
    <h2 id="coupon-item-title">🎫 选择要应用优惠券的商品</h2>
    <div id="coupon-item-list"></div>
    <div class="btn-row">
      <button class="btn" style="background:#f1f5f9;" onclick="closeCouponItem()">取消</button>
    </div>
  </div>
</div>
<!-- Option Select Modal -->
<div class="modal-bg" id="opt-select-bg">
  <div class="modal" style="max-height:80vh;overflow-y:auto;">
    <h2 id="opt-select-title">选择选项</h2>
    <div id="opt-select-body"></div>
    <div class="btn-row" style="margin-top:12px;">
      <button class="btn" style="background:#f1f5f9;" onclick="closeOptSelect()">取消</button>
      <button class="btn btn-primary" onclick="confirmOptions()">确认添加</button>
    </div>
  </div>
</div>
<!-- ── Payment Modal ────────────────────────────────────── -->
<div class="modal-bg" id="pay-modal-bg">
  <div class="modal pay-modal">
    <h2>💰 收银结算</h2>
    <!-- Order Summary -->
    <div id="pay-order-summary" style="margin-bottom:10px;font-size:13px;"></div>
    <div style="font-size:22px;font-weight:700;text-align:right;color:var(--primary);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);">
      应收: ¥<span id="pay-total">0.00</span>
      <span id="member-discount-badge" style="display:none;font-size:12px;color:var(--success);margin-left:8px;"></span>
    </div>
    <!-- Member Login -->
    <div style="margin-bottom:10px;display:flex;gap:8px;align-items:center;" id="member-row">
      <span style="font-size:12px;color:var(--text-secondary);cursor:pointer;" onclick="toggleMemberLogin()">🎫 会员折扣</span>
      <div id="member-login" style="display:none;flex:1;display:none;gap:4px;">
        <input id="member-name" class="form-input" placeholder="姓名" style="flex:1;font-size:12px;padding:6px 8px;">
        <input id="member-pw" class="form-input" type="password" placeholder="密码" style="flex:1;font-size:12px;padding:6px 8px;">
        <button class="btn btn-sm btn-primary" onclick="loginMember()" style="padding:4px 10px;font-size:12px;">验证</button>
      </div>
    </div>
    <!-- Payment Methods -->
    <div style="margin-bottom:12px;">
      <div style="font-weight:600;font-size:14px;margin-bottom:8px;">选择支付方式</div>
      <div style="display:flex;gap:8px;">
        <div class="pay-method" data-method="cash" onclick="selectPayMethod('cash')">
          <div class="pm-icon">💰</div>
          <div class="pm-label">纸币</div>
        </div>
        <div class="pay-method" data-method="wechat" onclick="selectPayMethod('wechat')">
          <div class="pm-icon"><img src="/static/wechat-logo.png" alt="微信" style="width:28px;height:28px;object-fit:contain;"></div>
          <div class="pm-label">微信</div>
        </div>
        <div class="pay-method" data-method="alipay" onclick="selectPayMethod('alipay')">
          <div class="pm-icon"><img src="/static/alipay-logo.png" alt="支付宝" style="width:28px;height:28px;object-fit:contain;"></div>
          <div class="pm-label">支付宝</div>
        </div>
      </div>
    </div>
    <!-- QR Code Area (wechat / alipay) -->
    <div id="pay-qr-area" style="display:none;text-align:center;margin-bottom:12px;">
      <img id="pay-qr-img" src="" alt="收款二维码"
           style="width:180px;height:180px;display:block;margin:0 auto 8px;border:2px solid var(--border);border-radius:8px;object-fit:contain;">
      <p style="color:var(--text-secondary);font-size:13px;margin:0;">
        📱 请顾客扫码支付后，点击下方确认收款
      </p>
    </div>
    <!-- Cash Area -->
    <div id="pay-cash-area" style="display:none;margin-bottom:12px;">
      <div class="form-group">
        <label style="font-weight:600;">实收金额 (¥)</label>
        <input type="number" class="form-input" id="pay-cash-input"
               step="0.01" min="0" placeholder="输入收款金额"
               oninput="calcChange()" style="font-size:16px;font-weight:700;text-align:center;">
      </div>
      <div id="pay-change-display" style="display:none;text-align:center;padding:10px;background:#f0fdf4;border-radius:8px;">
        <span style="font-size:14px;color:var(--text-secondary);">找零</span>
        <span style="font-size:28px;font-weight:700;color:var(--danger);display:block;">¥<span id="pay-change-amount">0.00</span></span>
      </div>
    </div>
    <!-- Buttons -->
    <div class="btn-row" style="margin-top:4px;">
      <button class="btn" style="background:#f1f5f9;" onclick="closePayModal()">取消</button>
      <button class="btn btn-success" id="btn-confirm-pay" onclick="confirmPay()" disabled>
        ✅ 确认收款
      </button>
    </div>
  </div>
</div>
<!-- ── Payment Success Modal ────────────────────────────── -->
<div class="modal-bg" id="pay-success-bg">
  <div class="modal" style="text-align:center;max-width:360px;">
    <div style="font-size:48px;margin:6px 0 4px;">✅</div>
    <h2 style="margin:0 0 10px;">支付成功</h2>
    <div id="pay-success-details" style="font-size:14px;color:var(--text-secondary);margin-bottom:12px;"></div>
    <!-- Receipt -->
    <div class="receipt" id="receipt-content" style="margin-bottom:12px;"></div>
    <button class="btn btn-primary btn-block" onclick="closePaySuccess()" style="margin-top:0;">
      继续收款
    </button>
  </div>
</div>
<script>
let cart = [];
let selectedPayMethod = '';
let currentPayOrder = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show';
  setTimeout(() => t.className = 'toast', 2000);
}
async function loadProducts() {
  const search = document.getElementById('search-input').value;
  const res = await fetch('/api/products?search=' + encodeURIComponent(search));
  const products = await res.json();
  window._productCache = products;
  const el = document.getElementById('products-list');
  el.innerHTML = products.map(p => {
    const hasDiscount = p.discount > 0;
    const isFixed = p.discount_type === 'fixed';
    const isCoupon = p.is_coupon ? true : false;
    let finalPrice = p.price;
    if (hasDiscount) {
      if (isFixed) {
        finalPrice = Math.max(0, p.price - p.discount);
      } else {
        finalPrice = p.price * (100 - p.discount) / 100;
      }
    }
    const discountBadge = hasDiscount && !isCoupon
      ? (isFixed
        ? `<span class="discount-badge discount-badge-fixed">-¥${parseFloat(p.discount).toFixed(2)}</span>`
        : `<span class="discount-badge discount-badge-percent">-${parseFloat(p.discount).toFixed(1)}%</span>`)
      : '';
    const couponVal = isCoupon ? parseFloat(p.discount || p.price || 0) : 0;
    const couponPct = isCoupon && p.discount_type === 'percent';
    const couponLabel = isCoupon ? (couponPct ? '- ' + couponVal.toFixed(1) + '%' : '- ¥' + couponVal.toFixed(2)) : '';
    const couponBadge = isCoupon ? '<span class="discount-badge discount-badge-fixed">🎫 优惠券</span>' : '';
    const coupMode = isCoupon ? (p.coupon_mode || 'total') : '';
    const clickFinalPrice = isCoupon ? 0 : finalPrice;  // coupon price always 0 in cart, backend handles discount
    return `
    <div class="card" style="cursor:pointer;padding:12px 16px;" onclick="clickProduct(${p.id},'${p.name.replace(/'/g,"\\'")}',${clickFinalPrice},${p.discount||0},${p.price},${isCoupon},'${coupMode}')">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-weight:600;font-size:15px;">${p.name}</div>
          <div style="font-size:12px;color:var(--text-secondary);">${isCoupon ? '优惠券 · 需密码 · ' + (coupMode === 'item' ? '指定单品' : '减总额') : '库存: '+p.stock+' · '+p.category}</div>
        </div>
        <div style="font-size:18px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:6px;">
          ${isCoupon ? `<span style="color:#d97706;">${couponLabel}</span>` : (hasDiscount ? `<span style="text-decoration:line-through;color:var(--text-muted);font-size:13px;font-weight:400;">¥${p.price.toFixed(2)}</span> <span>¥${finalPrice.toFixed(2)}</span>` : `<span>¥${finalPrice.toFixed(2)}</span>`)}
          ${discountBadge}${couponBadge}
        </div>
      </div>
    </div>
  `}).join('');
}
function addToCart(id, name, price, optStr, opts) {
  const existing = cart.find(c => c.id === id && c.optStr === optStr);
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ id, name, price, qty: 1, optStr: optStr || '', options: opts || [] });
  }
  renderCart();
  toast(`已添加 ${name}`);
}
// ── Option Selection ──────────────────────────────────────────
let pendingProduct = null;
let selectedOptions = {};
function clickProduct(id, name, finalPrice, discount, origPrice, isCoupon, couponMode) {
  if (isCoupon) {
    pendingProduct = { id, name, price: finalPrice || 0, couponMode: couponMode || 'total' };
    if (couponMode === 'item') {
      // Show item selection modal
      const itemList = document.getElementById('coupon-item-list');
      const nonCouponItems = cart.filter(c => c.id !== id);
      if (nonCouponItems.length === 0) {
        toast('❌ 购物车中没有可应用的商品');
        return;
      }
      itemList.innerHTML = nonCouponItems.map((c, i) => `
        <div class="card" style="cursor:pointer;padding:10px;margin-bottom:6px;" onclick="selectCouponItem(${i})" data-idx="${i}">
          <div style="display:flex;justify-content:space-between;">
            <span style="font-weight:600;">${c.name}</span>
            <span style="color:var(--primary);">¥${(c.price*c.qty).toFixed(2)}</span>
          </div>
          <div style="font-size:12px;color:var(--text-secondary);">¥${c.price.toFixed(2)} × ${c.qty}</div>
        </div>
      `).join('');
      document.getElementById('coupon-item-title').textContent = `🎫 ${name} — 选择目标商品`;
      document.getElementById('coupon-item-bg').classList.add('active');
    } else {
      // Total mode: show password modal
      document.getElementById('coupon-pw-title').textContent = `🎫 ${name}`;
      document.getElementById('coupon-pw-input').value = '';
      document.getElementById('coupon-pw-bg').classList.add('active');
      setTimeout(() => document.getElementById('coupon-pw-input').focus(), 100);
    }
    return;
  }
  fetch(`/api/products/${id}/options`).then(r => r.json()).then(opts => {
    if (opts.length === 0) { addToCart(id, name, finalPrice, '', []); return; }
    pendingProduct = { id, name, price: finalPrice };
    document.getElementById('opt-select-title').textContent = `⚙️ ${name} — 选择选项`;
    selectedOptions = {};
    const body = document.getElementById('opt-select-body');
    body.innerHTML = '';
    opts.forEach(g => {
      const isMulti = g.multi_select ? '1' : '0';
      const hint = g.multi_select ? '<span style="font-size:10px;color:var(--text-muted);">（可多选）</span>' : '';
      let html = `<div class="opt-group" data-group="${g.group_name}" data-multi="${isMulti}" style="margin-bottom:12px;"><div style="font-weight:600;font-size:14px;margin-bottom:6px;">${g.group_name} ${hint}</div>`;
      g.options.forEach((o, oi) => {
        const adj = o.price_adjustment > 0 ? `+¥${o.price_adjustment.toFixed(2)}` : '';
        html += `<div class="opt-item" data-group="${g.group_name}" data-option="${o.option_name}" data-price="${o.price_adjustment}" onclick="selectOpt(this)" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid #e2e8f0;border-radius:6px;margin-bottom:4px;cursor:pointer;">`;
        html += `<span style="flex:1;">${o.option_name}</span>${adj ? `<span style="color:var(--primary);font-size:13px;">${adj}</span>` : ''}</div>`;
      });
      html += '</div>';
      body.innerHTML += html;
    });
    document.getElementById('opt-select-bg').classList.add('active');
  });
}
function selectOpt(el) {
  const group = el.getAttribute('data-group');
  const option = el.getAttribute('data-option');
  const priceAdj = parseFloat(el.getAttribute('data-price')) || 0;
  const groupEl = el.closest('.opt-group');
  const isMulti = groupEl ? groupEl.getAttribute('data-multi') === '1' : false;
  if (isMulti) {
    // Multi-select: toggle this option
    if (!selectedOptions[group]) selectedOptions[group] = [];
    const idx = selectedOptions[group].findIndex(o => o.option === option);
    if (idx >= 0) {
      // Deselect
      selectedOptions[group].splice(idx, 1);
      el.style.background = '#fff';
    } else {
      // Select
      selectedOptions[group].push({ option, priceAdj });
      el.style.background = '#eef2ff';
    }
  } else {
    // Single-select: deselect all, select this one
    selectedOptions[group] = [{ option, priceAdj }];
    el.parentElement.querySelectorAll('.opt-item').forEach(item => item.style.background = '#fff');
    el.style.background = '#eef2ff';
  }
}
function closeOptSelect() {
  document.getElementById('opt-select-bg').classList.remove('active');
  pendingProduct = null;
}
// ── Coupon Modal Handlers ────
function closeCouponPw() {
  document.getElementById('coupon-pw-bg').classList.remove('active');
  pendingProduct = null;
}
function confirmCouponPw() {
  const pw = document.getElementById('coupon-pw-input').value;
  if (pw !== '102938') { toast('❌ 密码错误'); return; }
  document.getElementById('coupon-pw-bg').classList.remove('active');
  const p = pendingProduct;
  const cName = (p.couponMode === 'item' && p.targetItem) ? (p.name + ' → ' + p.targetItem.name) : p.name;
  // Add to cart with price=0 and coupon tag — backend calculates the discount
  addToCart(p.id, cName, 0, (p.couponMode === 'item' && p.targetItem) ? p.targetItem.name : '', []);
  pendingProduct = null;
}
function closeCouponItem() {
  document.getElementById('coupon-item-bg').classList.remove('active');
  pendingProduct = null;
}
function selectCouponItem(idx) {
  const item = cart[idx];
  if (!item) return;
  pendingProduct.price = pendingProduct.price || 0;
  pendingProduct.targetItem = item;
  document.getElementById('coupon-item-bg').classList.remove('active');
  // Now show password
  document.getElementById('coupon-pw-title').textContent = `🎫 ${pendingProduct.name} → ${item.name}`;
  document.getElementById('coupon-pw-input').value = '';
  document.getElementById('coupon-pw-bg').classList.add('active');
  setTimeout(() => document.getElementById('coupon-pw-input').focus(), 100);
}
function confirmOptions() {
  const groupEls = document.getElementById('opt-select-body').querySelectorAll('.opt-group');
  for (const gEl of groupEls) {
    const gname = gEl.getAttribute('data-group');
    const sel = selectedOptions[gname];
    if (!sel || sel.length === 0) { toast(`❌ 请选择「${gname}」`); return; }
  }
  let extra = 0;
  const strs = [];
  const optsData = [];
  for (const gname in selectedOptions) {
    const sel = selectedOptions[gname];
    for (const s of sel) {
      extra += s.priceAdj;
      strs.push(s.option);
      optsData.push({ group: gname, option: s.option, priceAdj: s.priceAdj });
    }
  }
  addToCart(pendingProduct.id, pendingProduct.name, pendingProduct.price + extra, strs.join(' / '), optsData);
  closeOptSelect();
}
function renderCart() {
  const el = document.getElementById('cart-items');
  const totalEl = document.getElementById('cart-total');
  const btn = document.getElementById('btn-checkout');
  if (cart.length === 0) {
    el.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:20px;font-size:14px;">购物车为空，请从下方选择商品</div>';
    totalEl.textContent = '¥0.00';
    btn.disabled = true;
    return;
  }
  let total = 0;
  el.innerHTML = cart.map((c, i) => {
    const sub = c.price * c.qty;
    total += sub;
    // Check if this item is a coupon (price=0 but name starts with coupon-like pattern)
    // Coupons are identified by having a product that's a coupon
    const isCouponItem = c.price === 0 && sub === 0;
    return `
      <div class="cart-item" ${isCouponItem ? 'style="background:#fff7ed;border-radius:6px;padding:8px;margin:4px 0;border:1px solid #fed7aa;"' : ''}>
        <div>
          <div style="font-weight:600;">${isCouponItem ? '🎫 ' : ''}${c.name}</div>
          ${c.optStr ? `<div style="font-size:11px;color:#6366f1;">📋 ${c.optStr}</div>` : ''}
          <div style="font-size:12px;color:${isCouponItem ? '#c2410c' : 'var(--text-secondary)'};">${isCouponItem ? '优惠券' : '¥' + c.price.toFixed(2)}</div>
        </div>
        <div class="cart-qty">
          <button onclick="changeQty(${i},-1)">−</button>
          <span style="font-weight:700;min-width:20px;text-align:center;">${c.qty}</span>
          <button onclick="changeQty(${i},1)">+</button>
          <button onclick="changeQty(${i},-999)" style="border-color:#fee2e2;color:var(--danger);">✕</button>
        </div>
      </div>
    `;
  }).join('');
  totalEl.textContent = `¥${total.toFixed(2)}`;
  btn.disabled = false;
}
function changeQty(idx, delta) {
  if (cart[idx].qty + delta <= 0) {
    cart.splice(idx, 1);
  } else {
    cart[idx].qty += delta;
  }
  renderCart();
}
// ── Payment Flow ──────────────────────────────────────────────
// ── Member Discount ────────────────────────────────────────
let pendingMember = null;
function toggleMemberLogin() {
  const el = document.getElementById('member-login');
  if (!el) return;
  el.style.display = el.style.display === 'none' ? 'flex' : 'none';
  if (el.style.display !== 'none') { var inp=document.getElementById('member-name'); if(inp)inp.focus(); }
}
async function loginMember() {
  const name = document.getElementById('member-name').value.trim();
  const pw = document.getElementById('member-pw').value.trim();
  if (!name) { toast('请输入姓名'); return; }
  try {
    const res = await fetch('/api/members/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name:name,password:pw}) });
    const d = await res.json();
    if (d.error) { toast('❌ '+d.error); return; }
    pendingMember = { customer_id: d.id || 0, customer_name: d.name };
    const badge = document.getElementById('member-discount-badge');
    if (d.discount_level === '90off') { badge.textContent = '🎉 连续3天 9折'; badge.style.display = 'inline'; }
    else if (d.discount_level === '95off') { badge.textContent = '👤 会员95折'; badge.style.display = 'inline'; }
    else { badge.textContent = '第'+d.consecutive_days+'天 ('+(3-d.consecutive_days)+'天后9折)'; badge.style.display = 'inline'; }
    toast('✅ 已识别'); document.getElementById('member-login').style.display = 'none';
    // Re-create order with member discount
    try {
      const note = document.getElementById('order-note').value.trim();
      const res = await fetch('/api/orders', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          items: cart.map(c => ({ product_id: c.id, quantity: c.qty, options: c.options || [] })),
          note: note, customer_id: d.id||0, customer_name: d.name
        })
      });
      const od = await res.json();
      if (!od.error) {
        window._pendingOrderId = od.order_id;
        window._pendingOrderTotal = od.total;
        document.getElementById('pay-total').textContent = od.total.toFixed(2);
      }
    } catch(e){}
  } catch(e) { toast('网络错误'); }
}
let cartBackup = [];
async function openPayModal() {
  if (cart.length === 0) return;
  // Save snapshot for receipt
  cartBackup = cart.map(c => ({...c}));
  // Show "calculating" state
  document.getElementById('pay-order-summary').innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:10px;">计算中...</div>';
  document.getElementById('pay-total').textContent = '...';
  pendingMember = null; document.getElementById('member-discount-badge').style.display='none'; document.getElementById('member-login').style.display='none'; document.getElementById('member-name').value=''; document.getElementById('member-pw').value='';
  document.getElementById('pay-modal-bg').classList.add('active');
  // Reset payment method
  selectedPayMethod = '';
  document.querySelectorAll('.pay-method').forEach(el => el.classList.remove('active'));
  document.getElementById('pay-qr-area').style.display = 'none';
  document.getElementById('pay-cash-area').style.display = 'none';
  document.getElementById('pay-cash-input').value = '';
  document.getElementById('pay-change-display').style.display = 'none';
  document.getElementById('btn-confirm-pay').disabled = true;
  // Create order first to get the real total from backend
  try {
    const note = document.getElementById('order-note').value.trim();
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        items: cart.map(c => ({ product_id: c.id, quantity: c.qty, options: c.options || [] })),
        note: note,
        customer_id: (pendingMember?pendingMember.customer_id:0),
        customer_name: (pendingMember?pendingMember.customer_name:'')
      })
    });
    const data = await res.json();
    if (data.error) {
      document.getElementById('pay-order-summary').innerHTML = '<div style="color:var(--danger);text-align:center;">❌ ' + data.error + '</div>';
      document.getElementById('pay-total').textContent = '0.00';
      return;
    }
    // Store the pre-created order ID for payment
    window._pendingOrderId = data.order_id;
    window._pendingOrderTotal = data.total;
    // Build order summary
    let html = '';
    cart.forEach(c => {
      const sub = c.price * c.qty;
      html += `<div style=\"display:flex;justify-content:space-between;padding:3px 0;font-size:13px;\">
        <span>${c.name}${c.optStr ? ' <span style=\"color:#6366f1;\">· '+c.optStr+'</span>' : ''} ×${c.qty}</span>
        <span>${sub > 0 ? '¥' + sub.toFixed(2) : '优惠券'}</span>
      </div>`;
    });
    document.getElementById('pay-order-summary').innerHTML = html;
    document.getElementById('pay-total').textContent = data.total.toFixed(2);
  } catch (e) {
    document.getElementById('pay-order-summary').innerHTML = '<div style="color:var(--danger);text-align:center;">❌ 网络错误</div>';
  }
}
function closePayModal() {
  document.getElementById('pay-modal-bg').classList.remove('active');
  selectedPayMethod = '';
  // Cancel the pre-created order if not paid
  if (window._pendingOrderId) {
    fetch(`/api/orders/${window._pendingOrderId}/cancel`, { method: 'POST' });
    window._pendingOrderId = null;
    window._pendingOrderTotal = null;
  }
}
function selectPayMethod(method) {
  selectedPayMethod = method;
  document.querySelectorAll('.pay-method').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-method') === method);
  });
  // Hide both areas first
  document.getElementById('pay-qr-area').style.display = 'none';
  document.getElementById('pay-cash-area').style.display = 'none';
  document.getElementById('pay-change-display').style.display = 'none';
  if (method === 'cash') {
    document.getElementById('pay-cash-area').style.display = 'block';
    document.getElementById('pay-cash-input').focus();
    updatePayButton();
  } else {
    // wechat / alipay
    const img = document.getElementById('pay-qr-img');
    img.src = `/static/qr/${method}.png`;
    img.onerror = function() {
      this.style.display = 'none';
      document.querySelector('#pay-qr-area p').textContent = '⚠️ 请先上传收款码图片到 static/qr/ 目录';
    };
    img.onload = function() { this.style.display = 'block'; };
    document.getElementById('pay-qr-area').style.display = 'block';
    document.getElementById('btn-confirm-pay').disabled = false;
  }
}
function calcChange() {
  const total = parseFloat(document.getElementById('pay-total').textContent) || 0;
  const paid = parseFloat(document.getElementById('pay-cash-input').value) || 0;
  const changeDisplay = document.getElementById('pay-change-display');
  if (paid >= total && paid > 0) {
    const change = paid - total;
    document.getElementById('pay-change-amount').textContent = change.toFixed(2);
    changeDisplay.style.display = 'block';
  } else {
    changeDisplay.style.display = 'none';
  }
  updatePayButton();
}
function updatePayButton() {
  const total = parseFloat(document.getElementById('pay-total').textContent) || 0;
  const btn = document.getElementById('btn-confirm-pay');
  if (selectedPayMethod === 'cash') {
    const paid = parseFloat(document.getElementById('pay-cash-input').value) || 0;
    btn.disabled = paid < total || paid <= 0;
  } else if (selectedPayMethod === 'wechat' || selectedPayMethod === 'alipay') {
    btn.disabled = false;
  } else {
    btn.disabled = true;
  }
}
async function confirmPay() {
  if (!selectedPayMethod || cart.length === 0) return;
  const btn = document.getElementById('btn-confirm-pay');
  btn.disabled = true;
  btn.textContent = '⏳ 处理中...';
  const orderId = window._pendingOrderId;
  const orderTotal = window._pendingOrderTotal;
  if (!orderId) {
    toast('❌ 订单未创建，请重新打开结算');
    closePayModal();
    return;
  }
  const total = parseFloat(document.getElementById('pay-total').textContent) || 0;
  let paidAmount = total;
  if (selectedPayMethod === 'cash') {
    paidAmount = parseFloat(document.getElementById('pay-cash-input').value) || 0;
    if (paidAmount < total) {
      toast('❌ 实收金额不足，应收 ¥' + total.toFixed(2));
      btn.textContent = '✅ 确认收款';
      btn.disabled = false;
      return;
    }
  }
  try {
    // Process payment
    const res2 = await fetch(`/api/orders/${orderId}/pay`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        method: selectedPayMethod,
        paid_amount: selectedPayMethod === 'cash' ? paidAmount : orderTotal
      })
    });
    const data2 = await res2.json();
    if (data2.error) {
      // Cancel the unpaid order
      await fetch(`/api/orders/${orderId}/cancel`, { method: 'POST' });
      toast('❌ ' + data2.error);
      btn.textContent = '✅ 确认收款';
      btn.disabled = false;
      return;
    }
    // Success!
    // Play cashier sound via Web Audio API (same method as button clicks, reliable)
    try {
      var ac=new(window.AudioContext||window.webkitAudioContext)();
      ac.resume();
      [523,659,784,1047].forEach(function(f,i){
        var o=ac.createOscillator(),g=ac.createGain();
        o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(0.2,ac.currentTime+i*0.15);
        g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+i*0.15+0.4);
        o.connect(g);g.connect(ac.destination);
        o.start(ac.currentTime+i*0.15);o.stop(ac.currentTime+i*0.15+0.4);
      });
    } catch(e){}
    closePayModal();
    currentPayOrder = { id: orderId, total: data2.total, paid: data2.paid, change: data2.change, method: data2.method };
    showPaySuccess(orderId, data2);
    cart = [];
    renderCart();
    loadProducts();
    document.getElementById('order-note').value = '';
    window._pendingOrderId = null;
    window._pendingOrderTotal = null;
  } catch (e) {
    toast('❌ 网络错误');
    btn.textContent = '✅ 确认收款';
    btn.disabled = false;
  }
}
function showPaySuccess(oid, data) {
  const methodNames = { cash: '纸币', wechat: '微信', alipay: '支付宝' };
  const methodIcon = { cash: '💰', wechat: '<img src=\"/static/wechat-logo.png\" style=\"width:16px;height:16px;vertical-align:middle;\">', alipay: '<img src=\"/static/alipay-logo.png\" style=\"width:16px;height:16px;vertical-align:middle;\">' };
  const details = document.getElementById('pay-success-details');
  details.innerHTML = `
    <div style="font-size:24px;font-weight:700;color:var(--primary);margin:4px 0;">
      ¥${data.total.toFixed(2)}
    </div>
    <div>${methodIcon[data.method]} ${methodNames[data.method]}</div>
    <div>订单 #${oid}</div>
    ${data.change > 0 ? `<div style="color:var(--danger);">找零 ¥${data.change.toFixed(2)}</div>` : ''}
  `;
  // Receipt
  const now = new Date();
  const timeStr = now.getFullYear() + '-' +
    String(now.getMonth()+1).padStart(2,'0') + '-' +
    String(now.getDate()).padStart(2,'0') + ' ' +
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0');
  let receiptHtml = `
    <div style="font-weight:700;font-size:15px;margin-bottom:6px;">🧾 凭条</div>
    <table style="width:100%;font-size:12px;border-collapse:collapse;">
  `;
  cartBackup.forEach(c => {
    receiptHtml += `<tr><td>${c.name}×${c.qty}</td><td style="text-align:right;">¥${(c.price*c.qty).toFixed(2)}</td></tr>`;
  });
  receiptHtml += `
    <tr><td colspan="2" style="border-top:1px dashed #ccc;padding-top:4px;"></td></tr>
    <tr><td style="font-weight:600;">合计</td><td style="text-align:right;font-weight:700;">¥${data.total.toFixed(2)}</td></tr>
    <tr><td style="color:#666;">支付</td><td style="text-align:right;color:#666;">${methodNames[data.method]}</td></tr>
    ${data.change > 0 ? `<tr><td style="color:#e53e3e;">找零</td><td style="text-align:right;color:#e53e3e;">¥${data.change.toFixed(2)}</td></tr>` : ''}
    <tr><td colspan="2" style="text-align:center;color:#999;padding-top:6px;font-size:11px;">${timeStr}</td></tr>
    <tr><td colspan="2" style="text-align:center;color:#999;font-size:11px;">谢谢惠顾！</td></tr>
  </table>
  `;
  document.getElementById('receipt-content').innerHTML = receiptHtml;
  document.getElementById('pay-success-bg').classList.add('active');
}
function closePaySuccess() {
  document.getElementById('pay-success-bg').classList.remove('active');
  currentPayOrder = null;
  cartBackup = [];
}
loadProducts();
</script>
